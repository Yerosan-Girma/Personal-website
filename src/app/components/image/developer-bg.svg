<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Gradient Background -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="70%" stop-color="#080C1D" />
      <stop offset="100%" stop-color="#04060E" />
    </linearGradient>

    <!-- Glowing Cyber Radial Highlights -->
    <radialGradient id="nebulaCyan" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaIndigo" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaEmerald" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="48" cy="48" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Perspective Grid Pattern for Floor -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#818CF8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- 1. Canvas Base & Ambient Nebulae -->
  <rect width="1920" height="1080" fill="url(#bgGradDark)" />
  <rect width="1920" height="1080" fill="url(#nebulaCyan)" />
  <rect width="1920" height="1080" fill="url(#nebulaIndigo)" />
  <rect width="1920" height="1080" fill="url(#nebulaEmerald)" />

  <!-- 2. Technical Grid Overlays -->
  <rect width="1920" height="1080" fill="url(#techGrid)" />
  <rect width="1920" height="1080" fill="url(#dotGrid)" opacity="0.6" />

  <!-- 3. Circuit Traces & Bus Lines -->
  <g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" fill="none">
    <path d="M 0 120 L 320 120 L 400 200 L 850 200" />
    <circle cx="850" cy="200" r="3" fill="#38BDF8" fill-opacity="0.6" />

    <path d="M 1920 180 L 1500 180 L 1420 260 L 1100 260" stroke="#818CF8" stroke-opacity="0.2" />
    <circle cx="1100" cy="260" r="3" fill="#818CF8" fill-opacity="0.6" />

    <path d="M 120 1080 L 120 850 L 220 750 L 500 750" stroke="#34D399" stroke-opacity="0.18" />
    <circle cx="500" cy="750" r="3" fill="#34D399" fill-opacity="0.5" />

    <path d="M 1800 1080 L 1800 900 L 1680 780 L 1380 780" stroke="#38BDF8" stroke-opacity="0.18" />
    <circle cx="1380" cy="780" r="3" fill="#38BDF8" fill-opacity="0.5" />
  </g>

  <!-- 4. Developer Code Streams & Terminal Snippets (Left Column Backdrop) -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#94A3B8" opacity="0.28">
    <!-- Code Block 1: Architecture -->
    <text x="60" y="240" fill="#38BDF8" opacity="0.6">// ARCHITECTURE SPECIFICATION</text>
    <text x="60" y="265"><tspan fill="#C084FC">interface</tspan> <tspan fill="#67E8F9">PlatformConfig</tspan> &lt;<tspan fill="#F472B6">T</tspan>&gt; {</text>
    <text x="85" y="290">readonly <tspan fill="#93C5FD">cluster</tspan>: <tspan fill="#FCD34D">'production'</tspan> | <tspan fill="#FCD34D">'edge'</tspan>;</text>
    <text x="85" y="315">readonly <tspan fill="#93C5FD">latency</tspan>: <tspan fill="#34D399">'&lt;10ms'</tspan>;</text>
    <text x="85" y="340"><tspan fill="#F43F5E">readonly</tspan> <tspan fill="#93C5FD">services</tspan>: <tspan fill="#67E8F9">Map</tspan>&lt;<tspan fill="#FCD34D">string</tspan>, <tspan fill="#FCD34D">ServiceNode</tspan>&gt;;</text>
    <text x="60" y="365">}</text>

    <!-- Code Block 2: Async Pipeline -->
    <text x="60" y="420"><tspan fill="#C084FC">export async function</tspan> <tspan fill="#60A5FA">initializeSystem</tspan>() {</text>
    <text x="85" y="445"><tspan fill="#C084FC">const</tspan> app = <tspan fill="#C084FC">await</tspan> <tspan fill="#67E8F9">Express</tspan>.<tspan fill="#60A5FA">createRuntime</tspan>({</text>
    <text x="110" y="470">security: <tspan fill="#34D399">['helmet', 'cors', 'rateLimit']</tspan>,</text>
    <text x="110" y="495">database: <tspan fill="#FCD34D">'postgresql://pool:5432'</tspan>,</text>
    <text x="85" y="520">});</text>
    <text x="85" y="545"><tspan fill="#C084FC">return</tspan> app.<tspan fill="#60A5FA">listen</tspan>(<tspan fill="#F59E0B">PORT</tspan>, () =&gt; <tspan fill="#34D399">'READY'</tspan>);</text>
    <text x="60" y="570">}</text>

    <!-- Code Block 3: React Hook -->
    <text x="60" y="630"><tspan fill="#C084FC">const</tspan> usePerformanceMetrics = () =&gt; {</text>
    <text x="85" y="655"><tspan fill="#C084FC">const</tspan> [fps, setFps] = <tspan fill="#60A5FA">useState</tspan>(<tspan fill="#38BDF8">60</tspan>);</text>
    <text x="85" y="680"><tspan fill="#60A5FA">useEffect</tspan>(() =&gt; {</text>
    <text x="110" y="705"><tspan fill="#C084FC">const</tspan> observer = <tspan fill="#C084FC">new</tspan> <tspan fill="#67E8F9">PerformanceObserver</tspan>(logMetrics);</text>
    <text x="110" y="730">observer.<tspan fill="#60A5FA">observe</tspan>({ entryTypes: [<tspan fill="#FCD34D">'paint'</tspan>, <tspan fill="#FCD34D">'layout'</tspan>] });</text>
    <text x="85" y="755">}, []);</text>
    <text x="85" y="780"><tspan fill="#C084FC">return</tspan> { fps, score: <tspan fill="#34D399">98</tspan> };</text>
    <text x="60" y="805">};</text>
  </g>

  <!-- 5. Developer Code Streams (Right Column / Behind Profile Backdrop) -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#94A3B8" opacity="0.25">
    <text x="1350" y="220" fill="#34D399" opacity="0.6">// DATABASE INDEX TUNING</text>
    <text x="1350" y="245"><tspan fill="#C084FC">CREATE INDEX</tspan> idx_perf_optimized</text>
    <text x="1375" y="270"><tspan fill="#C084FC">ON</tspan> production_workloads (<tspan fill="#93C5FD">cluster_id</tspan>, <tspan fill="#93C5FD">latency</tspan>);</text>
    <text x="1350" y="295"><tspan fill="#64748B">-- Execution latency: 3.8ms [B-Tree scan]</tspan></text>

    <text x="1350" y="370" fill="#818CF8" opacity="0.6">// DOCKER MULTI-STAGE BUILD</text>
    <text x="1350" y="395"><tspan fill="#C084FC">FROM</tspan> node:20-alpine <tspan fill="#C084FC">AS</tspan> builder</text>
    <text x="1350" y="420"><tspan fill="#C084FC">WORKDIR</tspan> /usr/src/app</text>
    <text x="1350" y="445"><tspan fill="#C084FC">RUN</tspan> npm ci --production=true</text>
    <text x="1350" y="470"><tspan fill="#C084FC">CMD</tspan> [<tspan fill="#FCD34D">"node"</tspan>, <tspan fill="#FCD34D">"dist/server.js"</tspan>]</text>

    <text x="1350" y="550" fill="#38BDF8" opacity="0.6">// REACT UI TREE</text>
    <text x="1350" y="575">&lt;<tspan fill="#60A5FA">ThemeProvider</tspan> defaultTheme=<tspan fill="#FCD34D">"system"</tspan>&gt;</text>
    <text x="1375" y="600">&lt;<tspan fill="#60A5FA">MotionContext</tspan> reducedMotion=<tspan fill="#FCD34D">"user"</tspan>&gt;</text>
    <text x="1400" y="625">&lt;<tspan fill="#67E8F9">ScalablePortfolio</tspan> author=<tspan fill="#FCD34D">"Yerosan"</tspan> /&gt;</text>
    <text x="1375" y="650">&lt;/<tspan fill="#60A5FA">MotionContext</tspan>&gt;</text>
    <text x="1350" y="675">&lt;/<tspan fill="#60A5FA">ThemeProvider</tspan>&gt;</text>

    <!-- Terminal logs -->
    <text x="1350" y="750" fill="#34D399">[INFO] Build completed in 1.42s (zero warnings)</text>
    <text x="1350" y="775" fill="#38BDF8">[NET] 200 OK GET /api/v1/projects 12ms</text>
    <text x="1350" y="800" fill="#FCD34D">[STATUS] Healthcheck: 100% operational</text>
  </g>

  <!-- 6. Floating Code Icons & Symbols -->
  <g fill="#38BDF8" opacity="0.2">
    <!-- Curly Braces -->
    <text x="450" y="160" font-family="'JetBrains Mono', monospace" font-size="70" font-weight="bold">{</text>
    <text x="1550" y="780" font-family="'JetBrains Mono', monospace" font-size="70" font-weight="bold">}</text>
    <!-- Angle Brackets -->
    <text x="960" y="140" font-family="'JetBrains Mono', monospace" font-size="45" font-weight="bold">&lt;/&gt;</text>
    <text x="250" y="920" font-family="'JetBrains Mono', monospace" font-size="45" font-weight="bold">=&gt;</text>
    <text x="1200" y="920" font-family="'JetBrains Mono', monospace" font-size="35" font-weight="bold">async / await</text>
  </g>

  <!-- 7. Glowing Horizon Laser Accent -->
  <line x1="0" y1="2" x2="1920" y2="2" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.75" />
</svg>
