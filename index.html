<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Yerosan Girma — Full Stack Software Engineer</title>
    <meta name="description" content="Portfolio of Yerosan Girma — Full Stack Software Engineer based in Addis Ababa, Ethiopia. Specializing in React, TypeScript, Node.js, and high-performance databases." />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
      }
      /* Custom selection styling */
      ::selection {
        background-color: rgba(29, 78, 216, 0.25);
        color: inherit;
      }
      .dark ::selection {
        background-color: rgba(56, 189, 248, 0.3);
        color: #ffffff;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-blue-500/20 dark:selection:bg-cyan-400/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
